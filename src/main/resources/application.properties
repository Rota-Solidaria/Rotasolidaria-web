spring.application.name=rotasolidaria
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/rotasolidaria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo

spring.datasource.username=root
spring.datasource.password=1234

spring.flyway.enabled=true
spring.freemarker.cache=false
spring.freemarker.expose-session-attributes=true
server.servlet.session.tracking-modes=cookie

# Nunca mostrar detalhes técnicos (stack trace) para o usuário nas páginas de erro
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
